<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Studio — Grille suisse</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Helvetica,Arial,sans-serif;background:#fff;color:#111;letter-spacing:-.02em}
    a{color:inherit;text-decoration:none}
    nav{display:grid;grid-template-columns:1fr auto;padding:16px 24px;border-bottom:4px solid #111}
    .cta{background:#e10600;color:#fff;padding:10px 14px;font-weight:700}
    .hero{display:grid;grid-template-columns:1fr 1fr;min-height:70vh}
    .copy{padding:48px 28px;border-right:4px solid #111}
    h1{font-size:clamp(40px,7vw,76px);line-height:.9;text-transform:uppercase}
    .copy p{margin:18px 0 24px;max-width:380px;line-height:1.4;font-size:16px}
    .btn{display:inline-block;background:#111;color:#fff;padding:12px 16px;font-weight:700}
    .gridbox{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border-left:4px solid #111;min-height:70vh}
    .cell{border-right:1px solid #111;border-bottom:1px solid #111;opacity:0;transform:scale(.96);animation:11s ease-in-out infinite both}
    .cell:nth-child(4n){border-right:0}
    .c-k{background:#111}
    .c-r{background:#e10600}
    .c-w{background:#efefef}
    .cell:nth-child(1){animation-name:p1}.cell:nth-child(2){animation-name:p2}
    .cell:nth-child(3){animation-name:p3}.cell:nth-child(4){animation-name:p4}
    .cell:nth-child(5){animation-name:p5}.cell:nth-child(6){animation-name:p6}
    .cell:nth-child(7){animation-name:p7}.cell:nth-child(8){animation-name:p8}
    .cell:nth-child(9){animation-name:p9}.cell:nth-child(10){animation-name:p10}
    .cell:nth-child(11){animation-name:p11}.cell:nth-child(12){animation-name:p12}
    .cell:nth-child(13){animation-name:p13}.cell:nth-child(14){animation-name:p14}
    .cell:nth-child(15){animation-name:p15}.cell:nth-child(16){animation-name:p16}
    @keyframes p1{0%,4%{opacity:0;transform:scale(.96)}10%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p2{0%,8%{opacity:0;transform:scale(.96)}14%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p3{0%,12%{opacity:0;transform:scale(.96)}18%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p4{0%,16%{opacity:0;transform:scale(.96)}22%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p5{0%,20%{opacity:0;transform:scale(.96)}26%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p6{0%,24%{opacity:0;transform:scale(.96)}30%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p7{0%,28%{opacity:0;transform:scale(.96)}34%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p8{0%,32%{opacity:0;transform:scale(.96)}38%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p9{0%,36%{opacity:0;transform:scale(.96)}42%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p10{0%,40%{opacity:0;transform:scale(.96)}46%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p11{0%,44%{opacity:0;transform:scale(.96)}50%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p12{0%,48%{opacity:0;transform:scale(.96)}54%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p13{0%,52%{opacity:0;transform:scale(.96)}58%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p14{0%,56%{opacity:0;transform:scale(.96)}62%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p15{0%,60%{opacity:0;transform:scale(.96)}66%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    @keyframes p16{0%,64%{opacity:0;transform:scale(.96)}70%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:none}}
    .offers{display:grid;grid-template-columns:repeat(3,1fr);border-top:4px solid #111}
    .offer{padding:28px;border-right:4px solid #111;min-height:220px}
    .offer:last-child{border:0}
    .offer b{display:block;font-size:32px;margin:12px 0}
    #contact{padding:40px 28px 80px;max-width:560px}
    form{display:grid;gap:8px;margin-top:14px}
    input,select,button{min-height:48px;border:2px solid #111;padding:0 10px;font:inherit}
    button{background:#e10600;color:#fff;font-weight:700;cursor:pointer}
    .ok{display:none}
    @media(max-width:800px){.hero,.offers{grid-template-columns:1fr}.copy{border-right:0;border-bottom:4px solid #111}.gridbox{min-height:320px;border-left:0}}
  </style>
</head>
<body>
  <nav><strong>SIGNAL STUDIO</strong><a class="cta" href="#contact">AUDIT</a></nav>
  <section class="hero">
    <div class="copy">
      <h1>Module<br>par<br>module.</h1>
      <p>La grille se remplit, case après case. Un site n’est pas un décor : c’est une structure.</p>
      <a class="btn" href="#contact">Demander ma version</a>
    </div>
    <div class="gridbox" aria-label="Grille 4x4 qui se remplit">
      <div class="cell c-k"></div><div class="cell c-r"></div><div class="cell c-k"></div><div class="cell c-w"></div>
      <div class="cell c-w"></div><div class="cell c-k"></div><div class="cell c-r"></div><div class="cell c-k"></div>
      <div class="cell c-r"></div><div class="cell c-w"></div><div class="cell c-k"></div><div class="cell c-w"></div>
      <div class="cell c-k"></div><div class="cell c-r"></div><div class="cell c-w"></div><div class="cell c-k"></div>
    </div>
  </section>
  <section class="offers">
    <article class="offer"><small>01</small><b>1 490 €</b><h3>Vitrine</h3><p>Une page. Un CTA.</p></article>
    <article class="offer"><small>02</small><b>2 900 €</b><h3>Conversion</h3><p>Parcours complet.</p></article>
    <article class="offer"><small>03</small><b>Devis</b><h3>Signature</h3><p>Système visuel.</p></article>
  </section>
  <section id="contact">
    <h2>PROJET</h2>
    <form onsubmit="event.preventDefault();this.querySelector('.ok').style.display='block'">
      <input placeholder="Activité" />
      <select><option>Budget 1 500–3 000 €</option><option>3 000–5 000 €</option><option>5 000 €+</option></select>
      <input type="email" placeholder="vous@email.fr" />
      <button>Recevoir le mini-audit</button>
      <div class="ok">Demande pré-validée ✓</div>
    </form>
  </section>
</body>
</html>
